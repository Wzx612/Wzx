# ============================================================================
# Atlas API gateway — reverse proxy + static frontend
#
# Routes /api/* to the appropriate service by path prefix, serves the built
# SPA for everything else. Mounted at /etc/nginx/nginx.conf.
# ============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Uploads must match the backend's accepted limit (rag.py MAX_BYTES = 50 MB)
    # plus multipart overhead. A smaller cap here makes nginx reset the connection
    # mid-body for 25-50 MB files, surfacing as net::ERR_CONNECTION_RESET in the
    # browser instead of a clean 413 from the app.
    client_max_body_size 55m;

    # Upstreams (docker DNS resolves service names on the atlas-net network).
    upstream embedding_backend { server embedding-service:8000; }
    upstream rag_backend       { server rag-service:8000; }
    upstream agent_backend     { server agent-service:8000; }

    # Shared proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # ── Gateway health ─────────────────────────────────────────────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ── Embedding service ──────────────────────────────────────────────
        # Internal contract used by rag/agent; exposed for diagnostics.
        location /api/embeddings/ {
            proxy_pass http://embedding_backend;
            proxy_read_timeout 300s;
        }

        # ── Agent service: Knowledge Agent + multimodal + vision ───────────
        # SSE-friendly (buffering off) for streamed agent responses.
        location ~ ^/api/(agent|multimodal|vision)(/|$) {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # ── RAG service: upload / parse / chunk / retrieval / DeepSeek QA ───
        # Catch-all for the remaining /api routes (files, documents, chunks,
        # vector, retrieval, rag). RAG streaming (/api/rag/query) is SSE.
        location /api/ {
            proxy_pass http://rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # ── Static frontend (SPA) ──────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
