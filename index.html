<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary identity ─────────────────────────────────────────── -->
    <title>Atlas · AI Multi-Agent Real Estate Advisor</title>
    <meta name="description" content="企业级多智能体 AI 房产决策平台。整合 RAG 知识库、MCP 工具调用、GIS 楼市情报与深度研究，助力北京房产投资分析。" />
    <meta name="keywords" content="AI Agent, 房产顾问, 多智能体, LangGraph, RAG, 楼市分析, 北京房产, real estate AI" />
    <meta name="author" content="Atlas AI" />
    <meta name="application-name" content="Atlas" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Favicon / PWA ─────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />

    <!-- ── Theme color (mobile browser chrome) ──────────────────────── -->
    <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />

    <!-- ── Open Graph ────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Atlas · AI Multi-Agent Real Estate Advisor" />
    <meta property="og:description" content="企业级多智能体 AI 房产决策平台，整合 LangGraph、RAG、GIS 与深度研究。" />
    <meta property="og:site_name" content="Atlas AI" />
    <meta property="og:locale" content="zh_CN" />

    <!-- ── Twitter Card ──────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Atlas · AI Multi-Agent Real Estate Advisor" />
    <meta name="twitter:description" content="企业级多智能体 AI 房产决策平台。" />

    <!-- ── Performance: DNS + font origin ───────────────────────────── -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JetBrains Mono — numbers, labels, code; display=swap prevents render-block -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- ── Critical CSS — loading shell + body baseline ─────────────── -->
    <!--
      This small stylesheet runs before the main bundle.  It covers:
        • Body background (eliminates white flash on cold load)
        • Loading spinner (visible while JS hydrates)
        • Reduced-motion respect
      Full design tokens live in src/styles/index.css, loaded by the bundle.
    -->
    <style>
      /* Reset */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* Render quality */
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Helvetica Neue", Helvetica,
          "PingFang SC", "Microsoft YaHei",
          Arial, sans-serif;
        scroll-behavior: smooth;
      }

      /* Dark (default) */
      html, html[data-theme="dark"] {
        background: #0B1020;
        color: #ffffff;
        color-scheme: dark;
      }

      /* Light */
      html[data-theme="light"] {
        background: #F4F6FB;
        color: #0B1020;
        color-scheme: light;
      }

      body {
        min-height: 100dvh;
        overflow-x: hidden;
        background: inherit;
      }

      #root { min-height: 100dvh; }

      /* ── Loading shell ──────────────────────────────────────────── */
      #atlas-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: inherit;
        /* Subtle aurora behind loader */
        background-image:
          radial-gradient(ellipse 800px 500px at 50% 0%, rgba(79, 124, 255, 0.08) 0%, transparent 60%),
          radial-gradient(ellipse 600px 400px at 80% 100%, rgba(0, 212, 255, 0.06) 0%, transparent 60%);
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #atlas-loader.atlas-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Logo row */
      .atlas-loader__brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .atlas-loader__icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4F7CFF 0%, #00D4FF 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 32px rgba(79, 124, 255, 0.35);
      }

      .atlas-loader__wordmark {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #4F7CFF 0%, #00D4FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Spinner */
      .atlas-loader__spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(79, 124, 255, 0.18);
        border-top-color: #4F7CFF;
        animation: atlas-spin 0.75s linear infinite;
      }

      /* Status text */
      .atlas-loader__status {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: #64748B;
      }

      html[data-theme="light"] .atlas-loader__status { color: #8A95AC; }

      @keyframes atlas-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .atlas-loader__spinner { animation-duration: 2s; }
        html { scroll-behavior: auto; }
      }
    </style>

    <!--
      ── Theme + language bootstrap script ──────────────────────────────
      Runs synchronously (no defer/async) before the browser paints a
      single pixel.  Sets data-theme and lang on <html> from localStorage
      so the critical CSS above resolves to the correct colour scheme
      immediately — zero flash of wrong theme.
    -->
    <script>
      (function () {
        try {
          // Theme
          var storedTheme = localStorage.getItem('atlas-theme');
          var systemDark  = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme       = storedTheme === 'light' || storedTheme === 'dark'
                              ? storedTheme
                              : (systemDark ? 'dark' : 'dark'); /* default dark */
          document.documentElement.setAttribute('data-theme', theme);

          // Language
          var storedLang = localStorage.getItem('atlas-lang');
          var lang       = storedLang === 'en' ? 'en' : 'zh';
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        } catch (_) {
          /* localStorage blocked (e.g. private-mode iframe) — stay on defaults */
        }
      })();
    </script>
  </head>

  <body>
    <!--
      Loading shell: visible while the JS bundle downloads and React
      hydrates.  Dismissed automatically by MutationObserver below the
      moment #root receives its first child element.
    -->
    <div id="atlas-loader" role="status" aria-label="正在启动 Atlas AI 平台">
      <div class="atlas-loader__brand">
        <div class="atlas-loader__icon" aria-hidden="true">
          <!-- Atlas hexagon logo mark -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M12 2L21.5 7.5V16.5L12 22L2.5 16.5V7.5L12 2Z"
              stroke="white"
              stroke-width="1.6"
              stroke-linejoin="round"
              fill="none"
            />
            <path
              d="M12 2V22M2.5 7.5L21.5 16.5M21.5 7.5L2.5 16.5"
              stroke="rgba(255,255,255,0.45)"
              stroke-width="1"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <span class="atlas-loader__wordmark">Atlas</span>
      </div>

      <div class="atlas-loader__spinner" aria-hidden="true"></div>

      <p class="atlas-loader__status">initializing agents&hellip;</p>
    </div>

    <!-- React mount point -->
    <div id="root"></div>

    <!-- Main application bundle -->
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Loader dismissal: watch #root for its first child (React's first
      render) then fade out and remove the loading shell.
      No changes to main.tsx / App.tsx required.
    -->
    <script>
      (function () {
        var loader = document.getElementById('atlas-loader');
        if (!loader) return;

        var root = document.getElementById('root');
        if (!root) { loader.remove(); return; }

        var observer = new MutationObserver(function () {
          if (root.firstChild) {
            observer.disconnect();
            loader.classList.add('atlas-loader--hidden');
            /* Remove from DOM after transition ends to free memory */
            loader.addEventListener('transitionend', function () {
              loader.remove();
            }, { once: true });
            /* Fallback removal in case transitionend never fires */
            setTimeout(function () {
              if (loader.parentNode) loader.remove();
            }, 600);
          }
        });

        observer.observe(root, { childList: true });

        /* Safety net: if React hasn't mounted after 10 s, hide the loader
           to avoid permanently blocking the UI on a network hiccup. */
        setTimeout(function () {
          if (loader.parentNode) {
            observer.disconnect();
            loader.classList.add('atlas-loader--hidden');
            setTimeout(function () { if (loader.parentNode) loader.remove(); }, 600);
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
