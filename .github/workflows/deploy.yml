name: CI/CD — build, test, push, deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-backend
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-gateway

permissions:
  contents: read
  packages: write

jobs:
  # ── 1+2+3. Checkout, build deps, test ───────────────────────────────────────
  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/atlas
      DASHSCOPE_API_KEY: dummy-not-used-in-ci
      DEEPSEEK_API_KEY: dummy-not-used-in-ci
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-bge-large-zh-v1.5

      - name: Install dependencies (CPU torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d atlas -f backend/init.sql

      - name: Run tests (excludes paid Qwen-VL integration)
        working-directory: backend
        run: pytest -q -k "not multimodal"

  # ── 4+5. Docker build + push (backend image and gateway/SPA image) ──────────
  build-push:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: atlas-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: gateway
            image: atlas-gateway
            context: .
            dockerfile: ./Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6+7. SSH to server and roll out the new images ──────────────────────────
  deploy:
    name: Deploy to server
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/atlas
            # Authenticate to GHCR for image pulls (read:packages PAT).
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            export REGISTRY_IMAGE="${{ env.BACKEND_IMAGE }}"
            export GATEWAY_IMAGE="${{ env.GATEWAY_IMAGE }}"
            export IMAGE_TAG="sha-${{ github.sha }}"
            bash deploy/deploy.sh "$IMAGE_TAG"
