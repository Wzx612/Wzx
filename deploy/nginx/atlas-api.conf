# ============================================================================
# Atlas — BACKEND/API vhost (api.example.com)
# Front/back separation: this subdomain proxies to the container gateway, which
# routes /api/* to the rag / agent / embedding services.
# Replace example.com; certbot --nginx adds the :443 block + redirect.
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    access_log /var/log/nginx/atlas-api.access.log;
    error_log  /var/log/nginx/atlas-api.error.log;

    include /etc/nginx/snippets/atlas-security-headers.conf;

    # Uploads up to 20 MB (+ multipart overhead). APIs are never edge-cached.
    client_max_body_size 25m;
    proxy_cache off;
    limit_conn conn_perip 50;

    # Upload endpoints — stricter rate limit, generous timeout (vision/embeds).
    location ~ ^/api/(multimodal|files|documents)/ {
        limit_req zone=upload_rl burst=5 nodelay;
        proxy_pass http://atlas_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # All other API traffic — incl. SSE streaming (/api/rag, /api/agent).
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://atlas_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE: stream tokens immediately
        proxy_read_timeout 300s;
    }

    # Anything outside /api on the API host is rejected.
    location / { return 404; }
}
