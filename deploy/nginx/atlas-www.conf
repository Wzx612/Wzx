# ============================================================================
# Atlas — FRONTEND vhost (www.example.com, example.com)
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# Replace example.com with your domain. certbot --nginx adds the :443 server
# block + HTTP→HTTPS redirect automatically (see ssl-init.sh).
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;

    access_log /var/log/nginx/atlas-www.access.log;
    error_log  /var/log/nginx/atlas-www.error.log;

    include /etc/nginx/snippets/atlas-security-headers.conf;
    limit_conn conn_perip 50;

    # Static assets — micro-cached at the edge + long browser cache.
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|map)$ {
        proxy_pass http://atlas_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache atlas_cache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # SPA shell — proxied to the container gateway (which does try_files fallback).
    location / {
        proxy_pass http://atlas_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
