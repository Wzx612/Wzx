# ============================================================================
# Atlas — shared security response headers (include from each server block)
# ============================================================================
add_header X-Frame-Options            "SAMEORIGIN"            always;
add_header X-Content-Type-Options     "nosniff"              always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection           "1; mode=block"        always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
# HSTS — enable only once HTTPS is confirmed working for all subdomains.
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
# Conservative CSP for the SPA; widen connect-src to your API origin if needed.
add_header Content-Security-Policy     "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https:; font-src 'self' data:;" always;
# Hide nginx version.
server_tokens off;
