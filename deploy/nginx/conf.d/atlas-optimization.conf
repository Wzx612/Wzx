# ============================================================================
# Atlas — host nginx http-context tuning (place in /etc/nginx/conf.d/)
# Gzip compression, proxy micro-cache, rate-limit zones, shared upstream.
# ============================================================================

# ── Upstream: the containerized gateway (loopback-bound) ────────────────────
upstream atlas_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── Gzip compression ────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/atom+xml image/svg+xml
    application/vnd.ms-fontobject application/x-font-ttf font/opentype;

# ── Proxy micro-cache for the SPA / static assets ───────────────────────────
proxy_cache_path /var/cache/nginx/atlas levels=1:2 keys_zone=atlas_cache:10m
                 max_size=512m inactive=60m use_temp_path=off;

# ── Rate-limit zones (anti-abuse; applied per-location in vhosts) ────────────
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=upload_rl:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

# Real client IP behind any upstream LB (adjust trusted ranges as needed).
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
