# Prometheus scrape configuration for the Atlas stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Host: CPU / memory / disk / network ──────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── Docker containers ────────────────────────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Redis ────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Application services (FastAPI /metrics — replaces SpringBoot Actuator) ─
  - job_name: atlas-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - "embedding-service:8000"
          - "rag-service:8000"
          - "agent-service:8000"
        labels:
          stack: atlas
